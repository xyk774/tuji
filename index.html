<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>途記 · 旅遊規劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14212B;--ground:#EEF1F4;--muted:#4A5966;--line:#D5DDE3;--field:#B5C0C9;--accent:#F0A15C;--danger:#8A3A0C}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select{font-family:inherit;font-size:15px}
button{cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:var(--ink);color:#fff}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:20px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Noto Serif TC',serif;font-weight:900;font-size:22px;letter-spacing:2px}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:20px}
.kicker{font-size:13px;color:#B9C4CD;letter-spacing:1px}
h1{margin:4px 0 0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.2}
.sub{margin-top:6px;color:#D5DDE3;font-size:14px}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stats small{display:block;font-size:12px;color:#B9C4CD}
.stats b{font-size:22px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:20px}
.tab{min-height:48px;padding:0 20px;border:none;border-radius:10px 10px 0 0;background:transparent;color:#D5DDE3}
.tab.on{background:var(--ground);color:var(--ink);font-weight:700}
main{padding-top:28px;padding-bottom:64px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.side{flex:1 1 220px;max-width:280px;display:flex;flex-direction:column;gap:8px}
.grow{flex:999 1 480px;min-width:0}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 2px rgba(20,33,43,.08)}
.dark{background:var(--ink);color:#fff}
h2{margin:0;font-size:16px}
.serif{font-family:'Noto Serif TC',serif;font-size:26px}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:none;background:var(--ink);color:#fff;font-weight:700}
.btn.ghost{background:#fff;color:#2E3D49;border:1px solid var(--field);font-weight:400}
.btn.dash{background:transparent;color:#2E3D49;border:1px dashed #8A98A4;font-weight:400}
.btn.warm{background:var(--accent);color:var(--ink)}
.btn.line{background:transparent;color:#fff;border:1px solid #50606D;font-weight:400}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #C9B2A6;font-weight:400}
.icon{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:8px;background:transparent;color:var(--muted);flex:none}
.icon:hover{background:#EEF1F4}
.icon.red{color:var(--danger)}
.day{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}
.day.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.day small{display:block;font-size:13px;opacity:.85}
.dot{border-radius:50%;flex:none;display:inline-block}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px;border-radius:10px;background:#F4F6F8}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.in{min-height:44px;padding:0 12px;border:1px solid var(--field);border-radius:8px;color:var(--ink);background:#fff;width:100%}
ol{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:56px 20px minmax(0,1fr);gap:12px}
.rail{display:flex;flex-direction:column;align-items:center}
.rail i{flex:1;width:2px;background:var(--line);min-height:40px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:#EEF1F4;color:#3A4A57;white-space:nowrap}
.note{color:var(--muted);font-size:14px}
.empty{padding:32px 16px;text-align:center;color:var(--muted);border:1px dashed #C7D0D7;border-radius:10px;margin-bottom:16px}
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.spot{display:flex;flex-direction:column;padding:20px}
.extra{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;font-size:14px}
.extra.compact{margin-top:8px;padding-top:8px;font-size:13px}
.xrow{display:flex;flex-direction:column;gap:4px}
.xlabel{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#8A3A0C}
.foods{display:flex;flex-wrap:wrap;gap:6px}
.food{display:inline-flex;align-items:center;min-height:32px;padding:2px 10px;border-radius:999px;background:#FDF0E4;color:#6E2F08;text-decoration:none;font-size:13px}
.food:hover{background:#F9DFC6;color:#6E2F08}
.card .spot{background:#F7F9FA;box-shadow:none;border:1px solid var(--line)}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.filter{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flabel{font-size:13px;color:var(--muted);min-width:40px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--field);background:#fff;color:#2E3D49;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter>span:first-child{min-width:64px}
.bars{display:inline-flex;gap:3px}
.bars i{width:18px;height:8px;border-radius:3px;background:#E2E7EB}
.bars i.on{background:#2F7D4F}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid #EEF1F4;vertical-align:top}
.stay-row{margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.bed{width:24px;height:24px;border-radius:50%;background:#EFEAF8;color:#6B4FB3;display:inline-flex;align-items:center;justify-content:center;margin-top:2px}
.dests{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dest{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #50606D;background:transparent;color:#fff}
.dest.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.infos{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.info{font-size:13px;padding:4px 12px;border-radius:999px;background:#1F2E3A;color:#D5DDE3}
.info b{color:#F0A15C;margin-right:6px;font-weight:500}
.map{position:relative;width:100%;height:clamp(360px,58vw,560px);border-radius:10px;overflow:hidden;background:#E4EADF;z-index:0}
.map.moving{outline:3px dashed #A9480F;outline-offset:-3px}
.map.moving .leaflet-container{cursor:crosshair}
.pin{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(20,33,43,.35);box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
.pin-wrap{background:none;border:none}
.toast{margin-bottom:10px;padding:10px 14px;border-radius:8px;background:#E3EBF6;color:#16365F;font-size:14px}
.gmap{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #50606D;color:#fff;text-decoration:none}
.gmap:hover{color:#fff;background:#1F2E3A}
.hint{margin-bottom:10px;padding:10px 14px;border-radius:8px;background:#FDF0E4;color:#6E2F08;font-size:14px}
.list{display:flex;flex-direction:column;max-height:360px;overflow-y:auto;padding:8px}
.prow{min-height:44px;display:flex;align-items:center;gap:10px;padding:6px 10px;border:none;border-radius:8px;text-align:left;background:transparent;color:var(--ink)}
.prow.on{background:#E3EBF6}
.badge{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.bar{height:12px;border-radius:999px;background:#E2E7EB;overflow:hidden}
.bar>div{height:100%;border-radius:999px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #E2E7EB}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.chk{min-height:44px;flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#1F5FBF;margin:0;flex:none}
.chk.done{color:#6B7884;text-decoration:line-through}
footer{color:var(--muted);font-size:13px;text-align:center;padding:0 20px 32px}
footer button{background:none;border:none;color:#1F5FBF;text-decoration:underline;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<footer>資料只儲存在你這台裝置的瀏覽器中。<button type="button" data-act="reset">把目前目的地恢復成範例資料</button></footer>
<script>
(function () {
  const KEY = 'tuji-trip-v1';
  const COLORS = ['#1F5FBF', '#A9480F', '#2F7D4F', '#6B4FB3', '#0F6E7A', '#8A2F5E'];
  const CAT_COLORS = { '交通': '#1F5FBF', '住宿': '#6B4FB3', '餐飲': '#A9480F', '門票購物': '#2F7D4F' };
  const TAGS = ['景點', '交通', '餐飲', '散步', '購物', '住宿'];
  let seq = 0;
  const nid = p => p + Date.now().toString(36) + (seq++);
  const col = i => COLORS[i % COLORS.length];
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = v => Number(v || 0).toLocaleString('en-US');
  const ICON = {
    pen: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>',
    x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>'
  };

  // ===== 目的地資料 =====
  // 每個目的地：基本資訊、推薦景點、預設範例行程
  const st = (time, name, tag, note) => ({ id: nid('s'), time, name, tag, note });
  const pk = (name, done) => ({ id: nid('k'), name, done: !!done });
  const baseGroups = (money, extra) => [
    { name: '證件與金錢', items: [pk('護照'), pk('機票訂位確認'), pk(money), pk('信用卡')] },
    { name: '電子用品', items: [pk('手機充電器'), pk('行動電源'), pk('網卡 / eSIM'), pk('耳機')] },
    { name: '衣物', items: [pk('薄外套'), pk('好走的鞋'), pk('換洗衣物'), pk('摺疊傘')] },
    { name: '盥洗與藥品', items: [pk('牙刷牙膏'), pk('保養品'), pk('個人常備藥'), pk('口罩')] },
    extra
  ];

  const DEST = {
    chengdu: {
      name: '成都', tagline: '熊貓、火鍋與蓋碗茶',
      info: [['貨幣', '人民幣 CNY'], ['時差', '與台灣相同'], ['電壓', '220V，注意電器是否支援'], ['入境', '需台胞證'], ['支付', '支付寶、微信支付很普遍'], ['交通', '地鐵、計程車、滴滴']],
      recs: [
        { group: '成都市區・近郊', name: '樂山大佛', where: '樂山', tag: '景點', note: '依山鑿刻的巨型石佛，可從成都搭高鐵前往，適合排一日遊。' },
        { group: '成都市區・近郊', name: '青城山', where: '都江堰', tag: '景點', note: '道教名山，前山步道林蔭清幽，可與都江堰排在同一天。' },
        { group: '成都市區・近郊', name: '四川博物院', where: '成都市區', tag: '景點', note: '了解巴蜀文化與川劇歷史的好去處，鄰近杜甫草堂。' },
        { group: '成都市區・近郊', name: '金沙遺址博物館', where: '成都市區', tag: '景點', note: '古蜀文明遺址，太陽神鳥金飾是成都的城市象徵。' },
        { group: '成都市區・近郊', name: '東郊記憶', where: '成都市區', tag: '散步', note: '舊工廠改建的文創園區，有展演空間與咖啡店。' },
        { group: '成都市區・近郊', name: '黃龍溪古鎮', where: '成都近郊', tag: '散步', note: '臨水的千年古鎮，石板街上有許多川味小吃。' },
        { group: '川西高原・冰川（需另外安排多天）', groupNote: '這些景點離成都較遠、海拔較高，通常要排 2～4 天，建議放慢行程以適應高度；山區天氣與道路狀況變化大，出發前請先確認景區是否開放。',
          name: '九寨溝', where: '阿壩州・約 2,000～3,100 公尺', tag: '景點', note: '以彩色的高山湖泊和層疊瀑布聞名，景區很大，建議至少玩一整天，可搭景區觀光車串連各景點。' },
        { group: '川西高原・冰川（需另外安排多天）', name: '黃龍風景區', where: '阿壩州・約 3,100～3,600 公尺', tag: '景點', note: '鈣華堆積成金黃色的梯田狀彩池，常和九寨溝排在同一趟。海拔高，可搭纜車上山再步行下山。' },
        { group: '川西高原・冰川（需另外安排多天）', name: '海螺溝冰川', where: '甘孜州・瀘定縣', tag: '景點', note: '可以近距離看到低海拔的冰川，搭纜車上觀景台，景區內也有溫泉可以泡。' },
        { group: '川西高原・冰川（需另外安排多天）', name: '達古冰川', where: '阿壩州・黑水縣', tag: '景點', note: '搭纜車可直上高海拔觀景台看冰川與雪山，上面空氣稀薄，動作要放慢。' },
        { group: '川西高原・冰川（需另外安排多天）', name: '四姑娘山', where: '阿壩州・小金縣', tag: '景點', note: '四座相連的雪山，雙橋溝、長坪溝適合健行看山景，比九寨溝離成都近。' }
      ],
      sample: () => ({
        trip: { title: '成都美食熊貓行', dates: '[出發日] — [回程日]', info: '2 人' },
        budget: 30000,
        days: [
          { id: nid('d'), date: '', theme: '抵達・老城區', stops: [
            st('14:00', '抵達成都・入住', '交通', '機場搭地鐵或計程車進市區'),
            st('16:00', '寬窄巷子', '散步', '清代老街改建的街區，適合邊逛邊吃'),
            st('17:30', '人民公園鶴鳴茶社', '餐飲', '體驗成都人喝蓋碗茶、掏耳朵的悠閒'),
            st('19:30', '四川火鍋', '餐飲', '怕辣可以點鴛鴦鍋')] },
          { id: nid('d'), date: '', theme: '熊貓・市中心', stops: [
            st('07:30', '成都大熊貓繁育研究基地', '景點', '早上熊貓比較活躍，建議一開園就進去'),
            st('12:30', '文殊院', '景點', '鬧中取靜的古剎，附近有素食與小吃'),
            st('15:00', '春熙路・太古里', '購物', '成都最熱鬧的商圈，有爬牆熊貓裝置'),
            st('19:00', '九眼橋', '散步', '錦江夜景與酒吧街')] },
          { id: nid('d'), date: '', theme: '都江堰一日遊', stops: [
            st('08:30', '前往都江堰', '交通', '從成都搭高鐵或動車前往'),
            st('10:00', '都江堰景區', '景點', '兩千多年前的水利工程，至今仍在運作'),
            st('15:00', '青城山', '景點', '時間夠可以順遊前山'),
            st('19:00', '返回成都', '交通', '')] },
          { id: nid('d'), date: '', theme: '三國文化・返程', stops: [
            st('09:00', '武侯祠', '景點', '紀念諸葛亮與劉備的祠堂'),
            st('11:00', '錦里古街', '購物', '就在武侯祠旁，買伴手禮的好地方'),
            st('14:00', '前往機場', '交通', '預留充足的報到時間')] }
        ],
        entries: [
          { id: nid('e'), name: '來回機票 × 2', amount: 14000, cat: '交通' },
          { id: nid('e'), name: '飯店 3 晚', amount: 7500, cat: '住宿' }
        ],
        groups: baseGroups('人民幣現金', { name: '成都必備', items: [pk('台胞證'), pk('支付寶 / 微信支付綁卡'), pk('腸胃藥（吃辣用）'), pk('VPN 或國際漫遊'), pk('保暖外套（去川西高原）')] })
      })
    },

    okinawa: {
      name: '沖繩', tagline: '自駕、海景與水族館',
      info: [['貨幣', '日圓 JPY'], ['時差', '比台灣快 1 小時'], ['電壓', '100V，插座同台灣'], ['入境', '台灣護照可免簽短期停留'], ['交通', '自駕最方便，需駕照日文譯本'], ['天氣', '日曬強，注意防曬']],
      recs: [
        { name: '首里城公園', tag: '景點', note: '琉球王國的王城，正殿仍在修復中，出發前可先確認開放範圍。' },
        { name: '古宇利島', tag: '景點', note: '開車經過古宇利大橋，兩側是透明的藍色海面。' },
        { name: '真榮田岬 青之洞窟', tag: '景點', note: '熱門的浮潛與潛水點，洞內海水呈現藍色光芒。' },
        { name: '玉泉洞', tag: '景點', note: '位在沖繩世界文化王國內的大型鐘乳石洞。' },
        { name: '海中道路', tag: '散步', note: '連接本島與離島的海上公路，適合開車兜風。' },
        { name: '新原海灘', tag: '散步', note: '南部的自然海灘，可搭玻璃底船看珊瑚。' }
      ],
      sample: () => ({
        trip: { title: '沖繩海島自駕', dates: '[出發日] — [回程日]', info: '2 人' },
        budget: 45000,
        days: [
          { id: nid('d'), date: '', theme: '抵達・那霸', stops: [

          <label class="f">日期<input class="in" data-bind="day.date" value="${esc(day.date)}" placeholder="例：10/24"></label>
          <label class="f">當日主題<input class="in" data-bind="day.theme" value="${esc(day.theme)}" placeholder="例：嵐山一日遊"></label>

        : `<div class="head"><div style="display:flex;align-items:center;gap:4px;min-width:0">
            <h2 class="serif">Day ${di + 1}：${esc(day.theme)}</h2>
            <button type="button" class="icon" data-act="themeEdit" aria-label="編輯這一天的主題與日期">${ICON.pen}</button></div>
            <button type="button" class="btn dash" data-act="startAdd">＋ 加入景點</button></div>`;
      const adding = ed && ed.id === 'new';
      const stops = day.stops.map(s => {
        const editing = ed && ed.id === s.id;
        const content = editing ? stopForm(ed.draft, false) : `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="min-width:0"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">

            <div style="display:flex;flex:none;margin-top:-8px">
              <button type="button" class="icon" data-act="editStop" data-id="${s.id}" aria-label="編輯景點">${ICON.pen}</button>
              <button type="button" class="icon red" data-act="delStop" data-id="${s.id}" aria-label="刪除景點">${ICON.trash}</button>
            </div></div>`;
        return `<li class="stop"><b style="font-variant-numeric:tabular-nums;padding-top:2px">${esc(s.time)}</b>
          <div class="rail"><span class="dot" style="width:14px;height:14px;margin-top:6px;background:${col(di)}"></span><i></i></div>
          <div style="padding-bottom:18px;min-width:0">${content}</div></li>`;
      }).join('');
      body = head + (day.stops.length === 0 && !adding ? '<div class="empty">這一天還沒有景點，按「＋ 加入景點」開始安排。</div>' : '')
        + `<ol>${stops}</ol>` + (adding ? stopForm(ed.draft, true, `新增景點到 Day ${di + 1}`) : '')
        + `<ol style="margin-top:6px">${stayRow(day, di)}</ol>`;
    }
    return `<section class="row"><div class="side"><h2 style="font-size:14px;color:var(--muted);font-weight:500">選擇日期</h2>${side}
      <button type="button" class="btn dash" style="min-height:48px" data-act="addDay">＋ 新增一天</button></div>

        ${color ? dot(color, 10) : ''}<span>${meta}</span><span class="pill">${esc(s.tag)}</span></div>
      <h3 class="serif" style="font-size:22px;margin:6px 0 6px">${esc(s.name)}</h3>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="${esc(gmapUrl(s))}" target="_blank" rel="noopener">在 Google 地圖查看 ↗</a>
        ${extra || ''}
      </div></article>`;

  // ===== 景點搜尋：站內資料 + 維基百科 =====
  const plain = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent || ''; };
  const shortNote = t => { const first = (t || '').split(/(?<=。)/)[0] || ''; return first.length > 80 ? first.slice(0, 78) + '…' : first; };

  function localSearch(q) {
    const out = []; const seen = new Set();
    const hit = name => name.includes(q) || q.includes(name);
    DEST_ORDER.forEach(k => {
      DEST[k].recs.forEach(r => { if (hit(r.name) && !seen.has(r.name)) { seen.add(r.name); out.push({ name: r.name, note: r.note, tag: r.tag, destKey: k }); } });
      ALL.trips[k].days.forEach(d => d.stops.forEach(s => {
        if (spotInfo(s.name) && hit(s.name) && !seen.has(s.name)) { seen.add(s.name); out.push({ name: s.name, note: s.note, tag: s.tag, destKey: k }); }
      }));
    });
    Object.keys(SPOT_INFO).forEach(n => { if (hit(n) && !seen.has(n)) { seen.add(n); out.push({ name: n, note: '', tag: '景點', destKey: null }); } });
    return out.slice(0, 6);
  }

  async function wikiSearch(q) {
    const api = 'https://zh.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=4&srsearch=' + encodeURIComponent(q);
    const r = await fetch(api); if (!r.ok) throw new Error('search ' + r.status);
    const titles = ((await r.json()).query || {}).search || [];
    const sums = await Promise.all(titles.map(async t => {
      try {
        const res = await fetch('https://zh.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(t.title.replace(/ /g, '_')), { headers: { 'Accept-Language': 'zh-TW' } });
        if (!res.ok) return null;
        const j = await res.json();
        if (j.type === 'disambiguation' || !j.extract) return null;
        return { name: plain(j.displaytitle) || j.title, extract: j.extract, img: j.thumbnail ? j.thumbnail.source : '',
          url: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || ('https://zh.wikipedia.org/wiki/' + encodeURIComponent(j.title)) };
      } catch (e) { return null; }
    }));
    return sums.filter(Boolean).slice(0, 3);
  }

  async function runSearch() {
    const q = (ui.search.q || '').trim(); if (!q) return;
    ui.search = { q, loading: true, local: localSearch(q), wiki: [], error: '', done: false };
    render();
    try { ui.search.wiki = await wikiSearch(q); }
    catch (e) { ui.search.error = '網路資料暫時查不到，可以直接用 Google 地圖搜尋。'; }
    ui.search.loading = false; ui.search.done = true;
    render();
  }

    let results = '';
    if (sr.done || sr.loading) {
      const local = sr.local.map((r, k) => spotCard(r, r.destKey ? `站內資料 · ${DEST[r.destKey].name}` : '站內資料', null, addBtn('local', k, r.name))).join('');
      const wiki = sr.wiki.map((w, k) => `<article class="card spot">
          ${w.img ? `<img src="${esc(w.img)}" alt="" loading="lazy" onerror="this.remove()" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:#E2E7EB">` : ''}

      const gq = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(sr.q + ' ' + dest().name);
      const status = sr.loading ? '<p class="note" style="margin:0">正在查詢網路資料…</p>'

            <button type="button" class="btn ghost" data-act="clearSearch">清除</button></div></div>
        ${status}
        ${local || wiki ? `<div class="spots" style="margin-top:12px">${local}${wiki}</div>` : ''}`;
    }
    return `<div class="card" style="padding:20px">
        <form data-search style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
          <label class="f" style="flex:1 1 260px">搜尋景點或美食<input class="in" type="search" data-bind="search.q" value="${esc(sr.q)}" placeholder="例：九寨溝、通天閣、首里城"></label>

  }

  }

  // ===== 預算估算：依行程自動推估 =====
  // 金額以當地貨幣計（cur），再乘上匯率換成新台幣；都是粗估，實際以當地為準
  const COST = {
    chengdu: { cur: 'CNY', sym: '¥', rate: 4.5, flight: 10000, meal: 70, dailyFood: 60, dailyTrans: 50, perGroupTrans: 0,
      lodging: { 1: 280, 2: 500, 3: 1200 }, transNote: '地鐵、滴滴' },
    okinawa: { cur: 'JPY', sym: '¥', rate: 0.21, flight: 8000, meal: 2000, dailyFood: 1500, dailyTrans: 0, perGroupTrans: 9000,
      lodging: { 1: 9000, 2: 16000, 3: 40000 }, transNote: '租車＋油錢＋停車（每車每天）' },
    osaka: { cur: 'JPY', sym: '¥', rate: 0.21, flight: 9000, meal: 2000, dailyFood: 1500, dailyTrans: 1200, perGroupTrans: 0,
      lodging: { 1: 9000, 2: 16000, 3: 40000 }, transNote: '地鐵、JR' },
    kyoto: { cur: 'JPY', sym: '¥', rate: 0.21, flight: 9000, meal: 2000, dailyFood: 1500, dailyTrans: 1200, perGroupTrans: 0,
      lodging: { 1: 9000, 2: 16000, 3: 40000 }, transNote: '公車、地鐵、JR' }
  };
  // 景點門票（每人，當地貨幣）；免費景點不列
  const TICKET = {
    // 京都
    '清水寺': 500, '金閣寺': 500, '龍安寺': 600, '銀閣寺': 500, '二條城': 1300, '三十三間堂': 600,
    '南禪寺': 600, '東福寺': 1000, '宇治平等院': 700,
    // 大阪
    '大阪城公園': 1200, '梅田藍天大廈空中庭園': 2000, '日本環球影城': 9800, '新世界・通天閣': 1200, '通天閣': 1200,
    '海遊館': 2700, '萬博紀念公園': 260,
    // 沖繩
    '沖繩美麗海水族館': 2180, '首里城公園': 400, '玉泉洞': 2000, '齋場御嶽': 300, '萬座毛': 100,
    // 成都
    '成都大熊貓繁育研究基地': 55, '都江堰景區': 80, '青城山': 80, '武侯祠': 50, '樂山大佛': 80, '金沙遺址博物館': 70,
    '九寨溝': 260, '黃龍風景區': 250, '海螺溝冰川': 300, '達古冰川': 200, '四姑娘山': 150
  };
  const FAR = ['九寨溝', '黃龍風景區', '海螺溝冰川', '達古冰川', '四姑娘山'];

  const people = () => Math.max(1, +S.people || +(((S.trip.info || '').match(/(\d+)\s*人/) || [])[1]) || 2);
  const cost = () => {
    const c = COST[ALL.current];
    return { ...c, rate: +S.rate > 0 ? +S.rate : c.rate, flight: S.flightPP != null && S.flightPP !== '' ? +S.flightPP : c.flight };
  };
  const chosenStay = () => {
    const name = (((S.trip.info || '').match(/住宿：([^·]*)/) || [])[1] || '').trim();
    return (STAYS[ALL.current] || []).find(h => h.name === name) || null;
  };

  function estimate() {
    const c = cost(); const n = people(); const nd = S.days.length; const nights = Math.max(0, nd - 1);
    const toNT = v => Math.round(v * c.rate);
    const fallback = chosenStay(); const rooms = Math.ceil(n / 2);
    const nightRows = S.days.map((d, i) => ({ i, d })).filter(({ i, d }) => i < nd - 1 || d.stay);
    let lodgeLocal = 0; const lodgeText = [];
    nightRows.forEach(({ i, d }) => {
      const tier = d.stay && d.stay.tier ? d.stay.tier : (fallback ? fallback.tier : 2);
      lodgeLocal += c.lodging[tier] * rooms;
      lodgeText.push(`Day ${i + 1} ${d.stay ? esc(d.stay.name) : '未安排'}（${TIER[tier].split(' ')[0]}${d.stay && !d.stay.tier ? '，以中價位估' : ''}）`);
    });
    const daysRows = []; const tickets = []; const farHit = [];
    let ticketSum = 0, foodSum = 0, transSum = 0;
    S.days.forEach((d, i) => {
      let t = 0;
      d.stops.forEach(s => {
        const p = TICKET[(s.name || '').trim()];
        if (p) { t += p * n; tickets.push({ day: i + 1, name: s.name, each: p, total: p * n }); }
        if (FAR.includes((s.name || '').trim())) farHit.push(s.name);
      });
      const meals = Math.max(2, d.stops.filter(s => s.tag === '餐飲').length);
      const food = (c.dailyFood + meals * c.meal) * n;
      const trans = c.perGroupTrans ? c.perGroupTrans * Math.ceil(n / 4) : c.dailyTrans * n;
      ticketSum += t; foodSum += food; transSum += trans;
      daysRows.push({ day: i + 1, theme: d.theme, ticket: toNT(t), food: toNT(food), trans: toNT(trans), meals });
    });
    const parts = [
      { key: '機票', nt: c.flight * n, how: `NT$ ${fmt(c.flight)} × ${n} 人（來回）`, actual: '交通' },
      { key: '住宿', nt: toNT(lodgeLocal), how: `${nightRows.length} 晚 × ${rooms} 間：${lodgeText.join('、') || '—'}`, actual: '住宿' },
      { key: '門票', nt: toNT(ticketSum), how: `${tickets.length} 個收費景點 × ${n} 人`, actual: '門票購物' },
      { key: '餐飲', nt: toNT(foodSum), how: `每天至少 2 餐，行程裡的餐廳另計`, actual: '餐飲' },
      { key: '當地交通', nt: toNT(transSum), how: `${c.transNote}，${nd} 天`, actual: '交通' }
    ];
    return { parts, total: parts.reduce((a, p) => a + p.nt, 0), daysRows, tickets, farHit, n, c, toNT };
  }

  function budgetView() {
    const E = estimate(); const c = E.c;
    const budget = Number(S.budget) || 0;
    const spent = S.entries.reduce((a, e) => a + e.amount, 0);
    const over = budget && E.total > budget;
    const pctEst = budget ? Math.min(100, Math.round(E.total / budget * 100)) : 0;
    const pctSpent = E.total ? Math.min(100, Math.round(spent / E.total * 100)) : 0;
    const colors = { '機票': '#1F5FBF', '住宿': '#6B4FB3', '門票': '#2F7D4F', '餐飲': '#A9480F', '當地交通': '#0F6E7A' };
    const partsHtml = E.parts.map(p => `<div>
        <div style="display:flex;justify-content:space-between;gap:8px;font-size:15px"><b>${p.key}</b><b style="font-variant-numeric:tabular-nums">NT$ ${fmt(p.nt)}</b></div>
        <div class="note" style="font-size:12px">${p.how}</div>
        <div class="bar" style="height:8px;margin-top:4px"><div style="background:${colors[p.key]};width:${E.total ? Math.round(p.nt / E.total * 100) : 0}%"></div></div></div>`).join('');
    const dayRows = E.daysRows.map(r => `<tr><td>Day ${r.day}<div class="note" style="font-size:12px">${esc(r.theme)}</div></td>
        <td>${fmt(r.ticket)}</td><td>${fmt(r.food)}<div class="note" style="font-size:12px">${r.meals} 餐</div></td><td>${fmt(r.trans)}</td><td><b>${fmt(r.ticket + r.food + r.trans)}</b></td></tr>`).join('');
    const ticketList = E.tickets.length ? E.tickets.map(t => `<div class="entry" style="padding:8px 0">
        <span><span class="pill">Day ${t.day}</span> ${esc(t.name)}</span>
        <span class="note" style="font-variant-numeric:tabular-nums">${c.sym}${fmt(t.each)} × ${E.n} ≈ <b style="color:var(--ink)">NT$ ${fmt(E.toNT(t.total))}</b></span></div>`).join('')
      : '<p class="note" style="margin:0">行程裡目前沒有已知門票的景點。</p>';
    const actualByCat = Object.keys(CAT_COLORS).map(cat => {
      const act = S.entries.filter(e => e.cat === cat).reduce((a, e) => a + e.amount, 0);
      const est = E.parts.filter(p => p.actual === cat).reduce((a, p) => a + p.nt, 0);
      return `<tr><td>${cat}</td><td>${fmt(est)}</td><td>${fmt(act)}</td><td style="color:${act > est ? '#8A3A0C' : '#2F7D4F'}">${act > est ? '+' : ''}${fmt(act - est)}</td></tr>`;
    }).join('');
    const entries = S.entries.slice().reverse().map(e => `<div class="entry">
      <div style="display:flex;align-items:center;gap:10px;min-width:0"><span class="pill">${esc(e.cat)}</span><span>${esc(e.name)}</span></div>
      <div style="display:flex;align-items:center;gap:4px;flex:none"><b style="font-variant-numeric:tabular-nums">NT$ ${fmt(e.amount)}</b>
      <button type="button" class="icon red" data-act="delEntry" data-id="${e.id}" aria-label="刪除這筆花費">${ICON.x}</button></div></div>`).join('');
    const f = ui.form;
    return `<section style="display:flex;flex-direction:column;gap:20px">
      ${ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : ''}
      <div class="row">
        <div class="side" style="flex:1 1 340px;max-width:420px;gap:16px">
          <div class="card">
            <div class="note" style="font-size:13px">依目前行程預估總花費（${E.n} 人）</div>
            <div style="font-family:'Noto Serif TC',serif;font-size:38px;font-weight:900;margin:4px 0">NT$ ${fmt(E.total)}</div>
            <div class="note" style="font-size:13px">平均每人約 NT$ ${fmt(Math.round(E.total / E.n))}</div>
            <div style="margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)">
              <label style="display:flex;align-items:center;gap:8px">預算 NT$<input type="number" class="in" style="width:130px" data-bind="budget" value="${esc(S.budget)}"></label>
              <button type="button" class="btn ghost" style="min-height:40px;padding:0 12px" data-act="useEstimate">用預估當預算</button></div>
            ${budget ? `<div class="bar" style="margin-top:12px"><div style="background:${over ? '#A9480F' : '#1F5FBF'};width:${pctEst}%"></div></div>
              <div style="margin-top:6px;font-size:13px;color:${over ? '#8A3A0C' : 'var(--muted)'}">${over ? `預估超出預算 NT$ ${fmt(E.total - budget)}` : `預估占預算 ${pctEst}%，還有 NT$ ${fmt(budget - E.total)} 彈性`}</div>` : ''}
          </div>
          <div class="card" style="display:flex;flex-direction:column;gap:14px"><h2>預估明細</h2>${partsHtml}</div>
          <div class="card" style="display:flex;flex-direction:column;gap:10px">
            <h2>估算設定</h2>
            <label class="f">人數<input type="number" min="1" class="in" data-bind="people" value="${esc(E.n)}"></label>
            <label class="f">匯率：1 ${c.cur} ≈ NT$<input type="number" step="0.01" class="in" data-bind="rate" value="${esc(c.rate)}"></label>
            <label class="f">每人來回機票 NT$<input type="number" class="in" data-bind="flightPP" value="${esc(c.flight)}"></label>
            <button type="button" class="btn" data-act="recalc">重新估算</button>
            <p class="note" style="margin:0;font-size:12px">住宿依「住宿」分頁選的飯店等級計算；匯率與機票請依實際查到的數字修改。</p>
          </div>
        </div>
        <div class="grow" style="display:flex;flex-direction:column;gap:20px">
          <div class="card">
            <h2 style="margin-bottom:10px">每日花費（門票＋餐飲＋交通）</h2>
            <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>天數</th><th>門票</th><th>餐飲</th><th>交通</th><th>小計 NT$</th></tr></thead><tbody>${dayRows}</tbody></table></div>
            ${E.farHit.length ? `<div class="hint" style="margin:12px 0 0">行程裡有 ${esc(E.farHit.join('、'))}，估算未包含從成都往返川西的交通（包車、巴士或機票），請另外加到實際花費。</div>` : ''}
          </div>
          <div class="card"><h2 style="margin-bottom:6px">收費景點</h2>${ticketList}</div>
          <div class="card">
            <h2 style="margin-bottom:10px">預估 vs 實際（NT$）</h2>
            <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>分類</th><th>預估</th><th>實際</th><th>差額</th></tr></thead><tbody>${actualByCat}
              <tr><td><b>合計</b></td><td><b>${fmt(E.total)}</b></td><td><b>${fmt(spent)}</b></td><td><b>${spent > E.total ? '+' : ''}${fmt(spent - E.total)}</b></td></tr></tbody></table></div>
            <div class="bar" style="margin-top:12px"><div style="background:#2F7D4F;width:${pctSpent}%"></div></div>
            <div class="note" style="font-size:13px;margin-top:6px">實際已花 ${pctSpent}% 的預估金額</div>
          </div>
          <div class="card"><h2 style="margin-bottom:16px">記一筆實際花費</h2>
            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
              <label class="f" style="flex:2 1 160px">項目<input class="in" data-bind="form.name" data-enter="addEntry" value="${esc(f.name)}" placeholder="例：嵐山抹茶"></label>
              <label class="f" style="flex:1 1 110px">金額（NT$）<input type="number" class="in" data-bind="form.amount" data-enter="addEntry" value="${esc(f.amount)}" placeholder="0"></label>
              <label class="f" style="flex:1 1 110px">分類<select class="in" data-bind="form.cat">${Object.keys(CAT_COLORS).map(cat => `<option ${cat === f.cat ? 'selected' : ''}>${cat}</option>`).join('')}</select></label>
              <button type="button" class="btn" data-act="addEntry">加入</button>
            </div>
            <div style="margin-top:22px;border-top:1px solid #E2E7EB">${entries}</div></div>
        </div>
      </div>
      <p class="note" style="margin:0">預估金額是依參考票價、餐費與房價等級粗略計算，實際會依季節、匯率與個人消費習慣不同，僅供規劃參考。</p>
    </section>`;
  }

  function packView() {
    const items = S.groups.flatMap(g => g.items);
    const done = items.filter(x => x.done).length;
    const groups = S.groups.map((g, gi) => `<div class="card" style="padding:22px"><h2 style="margin-bottom:6px">${esc(g.name)}</h2>
      ${g.items.map(it => `<div style="display:flex;align-items:center;justify-content:space-between;gap:4px">
        <label class="chk ${it.done ? 'done' : ''}"><input type="checkbox" data-toggle="${gi}:${it.id}" ${it.done ? 'checked' : ''}><span>${esc(it.name)}</span></label>
        <button type="button" class="icon" data-act="delPack" data-i="${gi}" data-id="${it.id}" aria-label="移除項目">${ICON.x}</button></div>`).join('')}
      <div style="display:flex;gap:8px;margin-top:10px">
        <input class="in" style="flex:1;min-width:0" data-bind="pack.${gi}" data-enter="addPack" data-i="${gi}" value="${esc(ui.packDraft[gi] || '')}" placeholder="新增項目" aria-label="新增打包項目">
        <button type="button" class="btn" data-act="addPack" data-i="${gi}">加入</button></div></div>`).join('');
    return `<section style="display:flex;flex-direction:column;gap:20px">
      <div class="card" style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 24px"><b>已打包 ${done} / ${items.length}</b>
        <div class="bar" style="flex:1 1 200px;height:10px"><div style="background:#2F7D4F;width:${items.length ? Math.round(done / items.length * 100) : 0}%"></div></div></div>
      <div class="grid4">${groups}</div></section>`;
  }

  function render() {
    const view = { plan: planView, map: spotsView, stay: stayView, budget: budgetView, pack: packView }[ui.tab]();
    document.getElementById('app').innerHTML = header() + `<main class="wrap">${view}</main>`;
    save();
  }

  const actions = {
    tab: t => { ui.tab = t.dataset.id; ui.moving = false; ui.toast = ''; },
    tripEdit: () => { ui.tripEdit = true; },
    tripDone: () => { ui.tripEdit = false; },
    pickDay: t => { ui.day = +t.dataset.i; ui.editing = null; ui.themeEdit = false; ui.stayEdit = null; },
    addDay: () => { S.days.push({ id: nid('d'), date: '', theme: '新的一天', stops: [] }); ui.day = S.days.length - 1; ui.themeEdit = true; ui.editing = null; },
    delDay: () => { if (S.days.length <= 1) return; if (!confirm('確定刪除這一天和其中的所有景點？')) return; S.days.splice(curDay(), 1); ui.day = Math.max(0, curDay() - 1); ui.themeEdit = false; },
    themeEdit: () => { ui.themeEdit = true; },
    themeDone: () => { ui.themeEdit = false; },
    startAdd: () => { ui.editing = { id: 'new', day: curDay(), draft: { time: '09:00', name: '', tag: '景點', note: '' } }; },
    editStop: t => { const f = findStop(t.dataset.id); if (f) ui.editing = { id: f.s.id, day: f.i, draft: { time: f.s.time, name: f.s.name, tag: f.s.tag, note: f.s.note } }; },
    delStop: t => { const f = findStop(t.dataset.id); if (!f) return; S.days[f.i].stops = S.days[f.i].stops.filter(x => x.id !== f.s.id); if (ui.editing && ui.editing.id === f.s.id) ui.editing = null; },
    cancelStop: () => { ui.editing = null; },
    saveStop: () => {
      const ed = ui.editing; if (!ed || !ed.draft.name.trim()) return;
      const day = S.days[ed.day]; const draft = { ...ed.draft, name: ed.draft.name.trim() };
      if (ed.id === 'new') {
        const s = { id: nid('s'), ...draft, lat: null, lng: null }; day.stops.push(s); ui.place = s.id;
      }
      else { const s = day.stops.find(x => x.id === ed.id); if (s) Object.assign(s, draft); }
      sortStops(day); ui.editing = null;
    },
    addRec: t => {
      const r = dest().recs[+t.dataset.i]; if (!r || inTrip(r.name)) return;
      const di = Math.min(ui.recDay == null ? curDay() : ui.recDay, S.days.length - 1); const day = S.days[di]; if (!day) return;
      const last = day.stops.length ? day.stops[day.stops.length - 1].time : '09:00';
      day.stops.push({ id: nid('s'), time: last || '09:00', name: r.name, tag: r.tag, note: r.note, lat: null, lng: null });
      sortStops(day); ui.toast = `已把「${r.name}」加入 Day ${di + 1}，時間可到每日行程調整。`;
    },
    addEntry: () => { const f = ui.form; const amt = parseInt(f.amount, 10); if (!f.name.trim() || !amt) return;
      S.entries.push({ id: nid('e'), name: f.name.trim(), amount: amt, cat: f.cat }); ui.form = { name: '', amount: '', cat: f.cat }; },
    delEntry: t => { S.entries = S.entries.filter(x => x.id !== t.dataset.id); },
    addPack: t => { const gi = +t.dataset.i; const v = (ui.packDraft[gi] || '').trim(); if (!v) return; S.groups[gi].items.push({ id: nid('k'), name: v, done: false }); ui.packDraft[gi] = ''; },
    delPack: t => { const g = S.groups[+t.dataset.i]; g.items = g.items.filter(x => x.id !== t.dataset.id); },
    useEstimate: () => { S.budget = Math.ceil(estimate().total / 1000) * 1000; ui.toast = `已把預算設為 NT$ ${fmt(S.budget)}（預估金額取整）。`; },
    recalc: () => {},
    stayArea: t => { ui.stay.area = t.dataset.id; },
    stayTier: t => { ui.stay.tier = +t.dataset.id; },
    staySort: t => { ui.stay.sort = t.dataset.id; },
    pickStay: t => {
      const h = (STAYS[ALL.current] || [])[+t.dataset.i]; if (!h) return;
      const target = ui.stayDay == null ? 'all' : String(ui.stayDay);
      if (target === 'all') {
        S.days.forEach((d, i) => { if (i < S.days.length - 1 || S.days.length === 1) d.stay = stayOf(h); });
        ui.toast = `已把「${h.name}」設為每一晚的住宿，可以到每日行程個別調整。`;
      } else {
        const i = +target; if (!S.days[i]) return; S.days[i].stay = stayOf(h);
        ui.toast = `已把「${h.name}」設為 Day ${i + 1} 晚上的住宿。`;
      }
    },
    editDayStay: t => { const i = +t.dataset.i; const cur = S.days[i] && S.days[i].stay; const list = STAYS[ALL.current] || [];
      const k = cur ? list.findIndex(h => h.name === cur.name) : -1;
      Object.assign(ui, { stayEdit: i, stayPickVal: k >= 0 ? String(k) : (cur ? 'custom' : ''), stayCustom: k < 0 && cur ? cur.name : '', stayNights: 1 }); },
    cancelDayStay: () => { ui.stayEdit = null; },
    clearDayStay: t => { const d = S.days[+t.dataset.i]; if (d) delete d.stay; },
    saveDayStay: () => {
      const i = ui.stayEdit; if (i == null || !S.days[i]) return;
      let st = null;
      if (ui.stayPickVal === 'custom') { const n = (ui.stayCustom || '').trim(); if (n) st = { name: n, area: '', tier: 0, how: '' }; }
      else if (ui.stayPickVal !== '') { const h = (STAYS[ALL.current] || [])[+ui.stayPickVal]; if (h) st = stayOf(h); }
      if (!st) { ui.toast = '請先選擇或輸入住宿名稱。'; return; }
      for (let j = i; j < Math.min(S.days.length, i + (ui.stayNights || 1)); j++) S.days[j].stay = { ...st };
      ui.stayEdit = null; ui.toast = '';
    },
    browseStay: t => { ui.stayDay = +t.dataset.i; ui.stayEdit = null; ui.tab = 'stay'; ui.toast = ''; window.scrollTo(0, 0); },
    clearSearch: () => { ui.search = { q: '', loading: false, local: [], wiki: [], error: '', done: false }; },
    addSearch: t => {
      const list = t.dataset.kind === 'wiki' ? ui.search.wiki : ui.search.local;
      const r = list[+t.dataset.i]; if (!r || inTrip(r.name)) return;
      const di = Math.min(ui.recDay == null ? curDay() : ui.recDay, S.days.length - 1); const day = S.days[di]; if (!day) return;
      const last = day.stops.length ? day.stops[day.stops.length - 1].time : '09:00';
      day.stops.push({ id: nid('s'), time: last || '09:00', name: r.name, tag: r.tag || '景點', note: r.note || shortNote(r.extract) });
      sortStops(day); ui.toast = `已把「${r.name}」加入 ${dest().name} 的 Day ${di + 1}，時間可到每日行程調整。`;
    },
    pickDest: t => { const k = t.dataset.id; if (!DEST[k]) return; ALL.current = k; S = ALL.trips[k];
      Object.assign(ui, { day: 0, editing: null, themeEdit: false, tripEdit: false, toast: '', recDay: null, packDraft: {}, stay: { area: '全部', tier: 0, sort: 'cp' }, stayDay: null, stayEdit: null }); window.scrollTo(0, 0); },
    reset: () => { if (!confirm(`確定要清除「${dest().name}」的修改，恢復成範例資料？`)) return; S = ALL.trips[ALL.current] = dest().sample(); Object.assign(ui, { day: 0, editing: null, themeEdit: false, tripEdit: false, toast: '' }); }
  };

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t || !actions[t.dataset.act]) return;
    actions[t.dataset.act](t, e); render();
  });

  document.addEventListener('input', e => {
    const t = e.target; const b = t.dataset.bind; if (!b) return;
    const [scope, key] = b.split('.'); const v = t.value;
    if (scope === 'draft' && ui.editing) ui.editing.draft[key] = v;
    else if (scope === 'day') { const d = S.days[curDay()]; if (d) d[key] = v; save(); }
    else if (scope === 'trip') { S.trip[key] = v; save(); }
    else if (scope === 'form') ui.form[key] = v;
    else if (scope === 'pack') ui.packDraft[key] = v;
    else if (['budget', 'people', 'rate', 'flightPP'].includes(scope)) { S[scope] = v; save(); }
    else if (scope === 'recDay') ui.recDay = +v;
    else if (scope === 'search') ui.search.q = v;
    else if (scope === 'stayPick') ui.stayPickVal = v;
    else if (scope === 'stayCustom') ui.stayCustom = v;
    else if (scope === 'stayNights') ui.stayNights = +v;
    else if (scope === 'stayDay') ui.stayDay = v === 'all' ? null : +v;
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.toggle) { const [gi, id] = t.dataset.toggle.split(':'); const it = S.groups[+gi].items.find(x => x.id === id); if (it) it.done = t.checked; render(); }
    else if (['budget', 'people', 'rate', 'flightPP'].includes(t.dataset.bind)) render();
  });

  document.addEventListener('submit', e => {
    if (!e.target.matches('[data-search]')) return;
    e.preventDefault(); runSearch();
  });

  document.addEventListener('keydown', e => {
    const t = e.target; if (e.key !== 'Enter' || !t.dataset.enter) return;
    e.preventDefault(); actions[t.dataset.enter](t, e); render();
    const again = document.querySelector(`[data-bind="${t.dataset.bind}"]`); if (again) again.focus();
  });

  render();
})();
</script>
</body>
</html>
